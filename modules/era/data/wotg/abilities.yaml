# Abilities as they were before the Wings of the Goddess updates.

abilities:
  whm:
    # Martyr: Revert range from 20 to 6 yalms
    martyr: {range: 6}

  bst:
    # Reward: Revert recast from 1 1/2 min to 3 minutes
    # https://www.bg-wiki.com/ffxi/Version_Update_(03/11/2008)
    reward: {recast: 180}
    # Sic: Allow use with jug pets in addition to charmed mobs
    # https://www.bg-wiki.com/ffxi/Version_Update_(11/09/2009)
    sic: {add_type: [jug_pet, charm_pet]}
    # Heel, Stay, Leave: Revert recast from 5 seconds to 10 seconds and remove the shared recast
    # http://www.playonline.com/pcd/update/ff11us/20071120wwnX41/detail.html
    heel:  {recast: 10, recast_id: 152}
    leave: {recast: 10, recast_id: 153}
    stay:  {recast: 10, recast_id: 154}

  pup:
    # Adds animation times back to maneuvers.
    # https://wiki.ffo.jp/html/3764.html
    fire_maneuver:    {animation: 83, animation_time: 2000}
    ice_maneuver:     {animation: 83, animation_time: 2000}
    wind_maneuver:    {animation: 83, animation_time: 2000}
    earth_maneuver:   {animation: 83, animation_time: 2000}
    thunder_maneuver: {animation: 83, animation_time: 2000}
    water_maneuver:   {animation: 83, animation_time: 2000}
    light_maneuver:   {animation: 83, animation_time: 2000}
    dark_maneuver:    {animation: 83, animation_time: 2000}
