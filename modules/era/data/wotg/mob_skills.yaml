# Mob skills and skill lists as they were before the Wings of the Goddess era updates.

# Automaton attachments Bone Crusher, Armor Piercer and Magic Mortar were not available yet.
mob_skills:
  bone_crusher_automaton:  {param: 999}
  armor_piercer_automaton: {param: 999}
  magic_mortar_automaton:  {param: 999}

