name: Reusable Runner Test Workflow

on:
  workflow_call:
    inputs:
      runner:
        description: 'Linux/Windows platform to test.'
        required: true
        type: string
      build_type:
        description: 'CMake build type.'
        required: false
        type: string
        default: 'Debug'
      test_modules:
        description: 'Test with modules enabled.'
        required: false
        type: boolean
        default: false
      multi_process:
        description: 'Test with multiple map processes.'
        required: false
        type: boolean
        default: false
      xi_test:
        description: 'Run xi_test tests.'
        required: false
        type: boolean
        default: true
      startup_checks:
        description: 'Run startup checks.'
        required: false
        type: boolean
        default: true

jobs:
  Runner_Test:
    name: ${{ format('{0}', inputs.runner) }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read         # Read repository contents
      checks: write          # Create check runs with test results
      pull-requests: write   # Post PR comments with test summaries
      actions: read          # Browse workflow runs and artifacts
      statuses: write        # Update commit statuses
    defaults:
      run:
        shell: bash
    env:
      XI_NETWORK_SQL_HOST: 127.0.0.1
      XI_NETWORK_SQL_PORT: 3306
      XI_NETWORK_SQL_DATABASE: xidb
      XI_NETWORK_SQL_LOGIN: xiadmin
      XI_NETWORK_SQL_PASSWORD: 'password'
      ASAN_OPTIONS: 'halt_on_error=1:abort_on_error=1:detect_leaks=1:detect_stack_use_after_return=1:detect_invalid_pointer_pairs=2:strict_string_checks=1:alloc_dealloc_mismatch=1:new_delete_type_mismatch=1:detect_odr_violation=2:quarantine_size_mb=256:max_free_fill_size=4096:symbolize=1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive # For navmeshes

      - name: Install dependencies (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew update && brew install --quiet \
            mariadb \
            zeromq \
            luajit \
            gnu-sed
          echo "PATH=$(brew --prefix gnu-sed)/libexec/gnubin:$PATH" >> $GITHUB_ENV
          cat << EOF >> /opt/homebrew/etc/my.cnf
          [mysqld]
          bind-address = 127.0.0.1
          skip-name-resolve = 1
          EOF
          brew services start mariadb

      - name: Install dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update && sudo apt-get install --assume-yes --no-install-recommends --quiet \
            binutils \
            git \
            libmariadb-dev-compat \
            libzmq5 \
            lua5.1 \
            luajit \
            mariadb-client \
            mariadb-server \
            openssl \
            tzdata \
            zlib1g

      - name: Setup MariaDB (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ankane/setup-mariadb@v1

      - name: Wait for MariaDB to be ready
        run: |
          while ! mysqladmin ping --silent; do
            sleep 1
          done

      - name: Setup database
        env:
          MYSQL_CMD: ${{ runner.os == 'Windows' && 'mysql -u root' || (runner.os == 'Linux' && 'sudo mysql' || 'mysql') }}
        run: |
          ${{ env.MYSQL_CMD }} -e "CREATE DATABASE IF NOT EXISTS ${{ env.XI_NETWORK_SQL_DATABASE }} CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"
          ${{ env.MYSQL_CMD }} -e "CREATE USER IF NOT EXISTS '${{ env.XI_NETWORK_SQL_LOGIN }}'@'%' IDENTIFIED BY '${{ env.XI_NETWORK_SQL_PASSWORD }}';"
          ${{ env.MYSQL_CMD }} -e "GRANT ALL PRIVILEGES ON ${{ env.XI_NETWORK_SQL_DATABASE }}.* TO '${{ env.XI_NETWORK_SQL_LOGIN }}'@'%';"
          ${{ env.MYSQL_CMD }} -e "FLUSH PRIVILEGES;"

      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          source ${{ runner.os == 'Windows' && '.venv/Scripts/activate' || '.venv/bin/activate' }}
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade -r ./tools/requirements.txt

      - name: Activate Python virtual environment
        run: |
          echo "${{ runner.os == 'Windows' && '.venv/Scripts' || '.venv/bin' }}" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$(pwd)/.venv" >> $GITHUB_ENV

      - name: Download artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ format('LSB_{0}_{1}_{2}', runner.os, inputs.build_type, github.sha) }}
          path: .

      - name: Download previous artifact
        if: ${{ github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' }}
        uses: dawidd6/action-download-artifact@v3
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: ${{ format('LSB_{0}_{1}_{2}', runner.os, inputs.build_type, github.sha) }}

      - name: Prepare executables
        run: |
          mv xi_map_tracy xi_map 2> /dev/null || true
          mv xi_test_tracy xi_test 2> /dev/null || true
          chmod +x xi_*

      - name: Enable modules
        if: ${{ inputs.test_modules }}
        run: |
          python <<EOF
          with open("modules/init.txt", "w") as f:
              f.write("custom\n")
              f.write("era\n")
              f.write("example\n")
              f.write("renamer\n")
          EOF

      - name: Initialize database
        run: python ./tools/dbtool.py update

      - name: Debug ASAN configuration
        if: ${{ inputs.xi_test }}
        run: |
          echo "=== ASAN Environment Variables ==="
          echo "ASAN_OPTIONS: ${ASAN_OPTIONS:-not set}"
          echo "LSAN_OPTIONS: ${LSAN_OPTIONS:-not set}"
          echo ""
          echo "=== Build type: ${{ inputs.build_type }} ==="
          echo ""
          echo "=== Checking xi_test binary ==="
          file ./xi_test || echo "file command failed"
          ldd ./xi_test 2>/dev/null | grep -i asan || echo "No ASAN library linked (may be statically linked)"
          nm ./xi_test 2>/dev/null | grep -i asan | head -5 || echo "No ASAN symbols found (may be stripped)"

      - name: Run xi_test
        if: ${{ inputs.xi_test }}
        id: xi_test
        continue-on-error: true
        run: |
          echo "=== Starting xi_test with ASAN ==="
          ./xi_test --keep-going --output tests.ctrf.json 2>&1 | tee xi_test_output.log
          exit_code=${PIPESTATUS[0]}
          echo ""
          echo "=== xi_test exit code: ${exit_code} ==="
          exit ${exit_code}

      - name: Publish Test Report
        if: ${{ !cancelled() && inputs.xi_test }}
        uses: ctrf-io/github-test-reporter@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          report-path: './tests.ctrf.json'
          github-report: true
          summary: true
          pull-request: false
          status-check: ${{ github.event_name != 'pull_request' }}
          status-check-name: 'xi_test (${{ inputs.runner }})'
          annotate: true
          upload-artifact: true
          artifact-name: 'xi_test-ctrf-${{ runner.os }}'

      - name: Check for ASAN errors
        if: ${{ inputs.xi_test }}
        id: asan_check
        run: |
          echo "=== Checking xi_test_output.log for ASAN errors ==="
          echo "Log file size: $(wc -c < xi_test_output.log 2>/dev/null || echo 'file not found') bytes"
          echo "Log file lines: $(wc -l < xi_test_output.log 2>/dev/null || echo 'file not found')"
          echo ""

          # Check if ASAN was actually active
          if grep -q "AddressSanitizer" xi_test_output.log 2>/dev/null; then
            echo "ASAN was active during test run"
          else
            echo "WARNING: No ASAN output detected - binary may not be compiled with ASAN"
          fi
          echo ""

          # Look for any sanitizer messages
          echo "=== All Sanitizer-related output ==="
          grep -i "sanitizer" xi_test_output.log 2>/dev/null | head -100 || echo "No sanitizer messages found"
          echo ""

          # Check for errors
          if grep -qE "ERROR: (Address|Leak|Memory)Sanitizer" xi_test_output.log 2>/dev/null; then
            echo "=== ASAN ERRORS FOUND ==="
            echo "## ASAN Errors Detected" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A 50 "ERROR: .*Sanitizer" xi_test_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            echo ""
            echo "=== Full ASAN error output ==="
            grep -A 100 "ERROR: .*Sanitizer" xi_test_output.log
            exit 1
          fi

          echo "No ASAN errors detected." >> $GITHUB_STEP_SUMMARY
          echo "=== ASAN check passed ==="

      - name: Startup checks
        if: ${{ inputs.startup_checks }}
        id: startup_checks
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: python -m tools.ci.startup_checks ${{ inputs.multi_process && 'multi' || '' }}

      - name: Summarize checks
        id: summarize_checks
        if: ${{ always() && (inputs.xi_test || inputs.startup_checks) }}
        run: |
          echo "## Startup Results" >> $GITHUB_STEP_SUMMARY
          found_issues=false
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  if grep -qi "warning\|error\|crash\|critical" "$log_file"; then
                      found_issues=true
                      log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                      echo "### :warning: ${log_name} Checks" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      grep -i "warning\|error\|crash\|critical" "$log_file" >> $GITHUB_STEP_SUMMARY
                      echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                      echo "" >> $GITHUB_STEP_SUMMARY
                  fi
              fi
          done
          if [[ "$found_issues" == "false" && "${{ steps.startup_checks.outcome }}" != "success" ]]; then
              echo "### :x: Startup checks failed, but no specific errors were found." >> $GITHUB_STEP_SUMMARY
              echo "Check the logs for details." >> $GITHUB_STEP_SUMMARY
          fi
          echo "<details><summary><h4>View Logs</h4></summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for log_file in ./log/*.log; do
              if [[ -f "$log_file" && -s "$log_file" ]]; then
                  log_name=$(basename "$log_file" .log | sed 's/.*/\u&/; s/-\(.\)/ \u\1/g')
                  echo "### :sailboat: ${log_name}" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  cat "$log_file" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              fi
          done
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Fail Workflow if Checks Failed
        if: ${{ steps.xi_test.outcome == 'failure' || steps.startup_checks.outcome == 'failure' || steps.asan_check.outcome == 'failure' }}
        run: |
          echo "Tests failed. See summary for details."
          exit 1
