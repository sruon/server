# yaml-language-server: $schema=schemas/augments.schema.json
#
# Standard augment IDs, as sent in item exdata (11 bits, so 1 to 2047). They follow the packet, not the DAT, so
# Windower resources and POLUtils dumps do not line up with them.
# Every ID marks the item as augmented; only the IDs listed here also grant modifiers.
# Commented-out IDs are known augments with no modifier yet.

