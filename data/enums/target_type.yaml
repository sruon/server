# yaml-language-server: $schema=../schemas/enums/_enum.schema.json

# Who a pending target may be, compared to the entity acting.

meta:
  flags: true
  cpp:
    underlying: uint16_t
  lua:
    table: xi.targetType

values:
  none:                    0x0000
  self:                    0x0001
  player_party:            0x0002
  enemy:                   0x0004
  player_alliance:         0x0008
  player:                  0x0010
  player_dead:             0x0020
  npc:                     0x0040 # a mob that looks like an npc and fights on the side of the character
  player_party_pianissimo: 0x0080
  pet:                     0x0100
  player_party_entrust:    0x0200
  ignore_battleid:         0x0400 # can hit targets that do not have the same battle id
  any_allegiance:          0x0800 # can hit targets from any allegiance at once, only for area skills
